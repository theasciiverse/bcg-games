# Asciiverse release workflow (tag v* or run by hand with a tag)
# Builds the eight bcg-games programs and packs one archive per game per
# target, named <id>-<target>.tar.gz (Linux, macOS) or .zip (Windows), plus
# a SHA256SUMS file, attached to one GitHub release; each game is its own
# catalog title reading its own archives (hub/catalog/SCHEMA.md).
#
# After Four in a Row's (1D-Pong's). Linux builds are glibc, not static
# musl: sound goes through rodio's ALSA output and gamepads through gilrs
# and udev, linked dynamically, so the binaries need libasound2 and
# libudev1 (the manifests' system_deps). Built on Ubuntu 22.04: glibc 2.35
# and newer. The archives carry README.md and LICENSE.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  IDS: hammurabi lunar-descent animal hexapawn bagels orbit splat civil-war
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config
          rustup update stable && rustup default stable
          cargo build --release --locked
          for id in $IDS; do
            strip target/release/$id
            ! ldd target/release/$id | grep -v -E 'linux-vdso|libc\.so|libm\.so|libgcc_s|ld-linux|libasound|libudev'
          done

      - name: Test
        run: cargo test --release --locked

      - name: Package for av
        run: |
          mkdir -p dist
          for id in $IDS; do
            rm -rf stage && mkdir stage
            cp target/release/$id README.md LICENSE stage/
            tar -czf "dist/$id-${{ matrix.target }}.tar.gz" -C stage .
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: |
          rustup update stable && rustup default stable
          rustup target add ${{ matrix.target }}
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          for id in $IDS; do
            rm -rf stage && mkdir stage
            strip target/${{ matrix.target }}/release/$id
            cp target/${{ matrix.target }}/release/$id README.md LICENSE stage/
            tar -czf "dist/$id-${{ matrix.target }}.tar.gz" -C stage .
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  windows:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        shell: bash
        run: |
          rustup update stable && rustup default stable
          rustup target add ${{ matrix.target }}
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          for id in $IDS; do
            rm -rf stage && mkdir stage
            cp target/${{ matrix.target }}/release/$id.exe README.md LICENSE stage/
            (cd stage && 7z a -tzip "../dist/$id-${{ matrix.target }}.zip" .)
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [linux, macos, windows]
    if: ${{ !cancelled() && needs.linux.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "bcg-games $TAG" \
                 --notes "Eight games after David H. Ahl's BASIC Computer Games (1978), rebuilt for the terminal from their rules: Hammurabi, Lunar Descent, Animal, Hexapawn, Bagels, Orbit, Splat and Civil War. One archive per game per platform; see the README and CLEANROOM.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
