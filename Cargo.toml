[package]
name = "bcg-games"
version = "0.7.0"
edition = "2021"
license = "MIT"
autobins = false
description = "bcg-games: games after David H. Ahl's BASIC Computer Games, rebuilt for the terminal. Rust + Ratatui"

[lib]
name = "bcg"
path = "src/lib.rs"

[[bin]]
name = "hammurabi"
path = "src/bin/hammurabi.rs"

[[bin]]
name = "lunar-descent"
path = "src/bin/lunar-descent.rs"

[[bin]]
name = "animal"
path = "src/bin/animal.rs"

[[bin]]
name = "hexapawn"
path = "src/bin/hexapawn.rs"

[[bin]]
name = "bagels"
path = "src/bin/bagels.rs"

[[bin]]
name = "orbit"
path = "src/bin/orbit.rs"

[[bin]]
name = "splat"
path = "src/bin/splat.rs"

[[bin]]
name = "civil-war"
path = "src/bin/civil-war.rs"

[[bin]]
name = "acey-ducey"
path = "src/bin/acey-ducey.rs"

[[bin]]
name = "basketball"
path = "src/bin/basketball.rs"

[[bin]]
name = "boxing"
path = "src/bin/boxing.rs"

[[bin]]
name = "bullfight"
path = "src/bin/bullfight.rs"

[[bin]]
name = "football"
path = "src/bin/football.rs"

[[bin]]
name = "golf"
path = "src/bin/golf.rs"

[[bin]]
name = "fur-trader"
path = "src/bin/fur-trader.rs"

[[bin]]
name = "king"
path = "src/bin/king.rs"

[[bin]]
name = "3d-tic-tac-toe"
path = "src/bin/3d-tic-tac-toe.rs"

[[bin]]
name = "hide-and-seek"
path = "src/bin/hide-and-seek.rs"

[dependencies]
ratatui = "0.30"
log = "0.4"
env_logger = "0.11"
rodio = { version = "0.22", default-features = false, features = ["playback"] }
gilrs = { version = "0.11", optional = true, default-features = false, features = ["xinput"] }

[features]
default = ["gamepad"]
gamepad = ["dep:gilrs"]

[profile.release]
debug = 1
